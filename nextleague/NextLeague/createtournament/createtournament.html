<!DOCTYPE html>
<html lang="en">
       
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear torneo</title>
     <link rel="stylesheet" href="createTournament.css">
</head>
 

<body>
    <nav class="navbar">

        <div class="container navbar-content">

            <!-- Logotipo -->
           <div class="logo-container">
                <img src="../logo/logoproyeco.png" alt="NextLeague tournament management platform logo">
            </div>
          </div>
    </nav>

    <main>
      <!-- no sé que poner-->    
        <section  id= "createtournament" class="description">
            <div>
                    <h1 >
                       Crear nuevo torneo
                    </h1>
                    <p style="font-size: 25px;">Completa la información para crear torneo</p>
                </div>
        </section>

        <section id="forms" class ="forms">
            
                <form action="#" method="post" class="tournament-form">
                <!------ COLUMNA IZQUIERDA DEL FORM-->
                    <div class="form-left">
                    <label for="tournamentName">Nombre del torneo:</label>
                    <input type="text" id="tournamentName" name="tournamentName" required pattern="[A-Za-z]+">

                    <label for="game">Juego:</label>
                    <input type="text" id="game" name="game" required pattern="[A-Za-z]+">

                    <label for="tournamentType">Tipo de torneo:</label>
                    <input type="text" id="tournamentType" name="tournamentType" required pattern="[A-Za-z]+">

                    <label for="teams">Numero de equipos:</label>
                    <input type="number" id="teams" name="teams" required>
                    </div>
                    <!------ COLUMNA CENTRAL DEL FORM-->
                    <div class="form-center">

                    <!-- Subir logo: se corrigió el id, ahora coincide con su label -->
                    <!-- accept="image/*" para que solo se puedan elegir imágenes -->
                    <label for="subir-imagen">
                        <span>Subir logo</span>
                        <img src="../iconos/camera.png" alt="logo upload" class="upload-icon">
                    </label>
                    <input type="file" id="subir-imagen" name="subir-imagen" accept="image/*" hidden required>
                    <!-- Aquí el script.js mete la vista previa y el botón de eliminar -->
                    <div class="upload-preview" id="preview-subir-imagen"></div>

                    <!-- Subir reglas: solo acepta PDF -->
                    <label for="subir-reglas">
                        <span>Subir reglas</span>
                        <img src="../iconos/folder.png" alt="image upload" class="upload-icon">
                    </label>
                    <input type="file" id="subir-reglas" name="subir-reglas" accept="application/pdf" hidden required>
                    <div class="upload-preview" id="preview-subir-reglas"></div>

                    </div>
                    <!------ COLUMNA DERECHA DEL FORM-->
                    <div class="form-right">
                    <label for="award">Premio total:</label>
                    <input type="number" id="award" name="award" required>

                    <label for="startDate">Fecha de inicio:</label>
                    <input type="date" id="startDate" name="startDate" required>

                    <label for="endDate">Fecha de finalización:</label>
                    <input type="date" id="endDate" name="endDate" required>

                    <label for="description">Descripción:</label>
                    <textarea id="description" name="description" rows="4" required pattern="[A-Za-z]+"></textarea>
                    </div>
                    <!----Boton de enviar-->
                    <button type="submit">Crear torneo</button>
                </form>
            

        </section>
    
    </main>

    <script src="script.js"></script>
</body>
</html>
